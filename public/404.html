<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - Page Not Found | BJI Dawati Brothers</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #020817;
        color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background-color: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1.25rem;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(12px);
      }
      .badge {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1rem;
        background-color: rgba(59, 130, 246, 0.12);
        border: 1px solid rgba(59, 130, 246, 0.25);
        color: #60a5fa;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        font-weight: 800;
        margin-bottom: 1.25rem;
        letter-spacing: -0.05em;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 0.875rem;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 1.5rem;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
      }
      @media (min-width: 480px) {
        .actions {
          flex-direction: row;
        }
      }
      .btn {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.7rem 1.1rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
      }
      .btn-secondary {
        background-color: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #f1f5f9;
      }
      .btn-secondary:hover {
        background-color: rgba(255, 255, 255, 0.15);
        color: #ffffff;
      }
      .btn-primary {
        background-color: #2563eb;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      }
      .btn-primary:hover {
        background-color: #1d4ed8;
      }
      .footer-links {
        margin-top: 1.25rem;
        padding-top: 1.25rem;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .footer-links a {
        font-size: 0.75rem;
        color: #94a3b8;
        text-decoration: none;
        transition: color 0.2s ease;
      }
      .footer-links a:hover {
        color: #60a5fa;
      }
    </style>
    <script>
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var basePath = '/bji-dawati-brothers';
        
        // Remove basePath prefix if present
        var path = pathname.startsWith(basePath) ? pathname.slice(basePath.length) : pathname;

        function decodeOrgId(str) {
          if (!str) return '';
          if (str.startsWith('-')) return str;
          try {
            var base64 = str.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) base64 += '=';
            var decoded = decodeURIComponent(escape(atob(base64)));
            if (decoded && (decoded.startsWith('-') || decoded.length >= 8)) {
              return decoded;
            }
          } catch(e) {}
          return str;
        }

        var reserved = {
          '': true,
          'dashboard': true,
          'contacts': true,
          'organizations': true,
          'profile': true,
          'settings': true,
          'login': true,
          'register': true,
          'manifest.webmanifest': true,
          'manifest.json': true,
          'favicon.ico': true,
          'default': true
        };

        // 1. Match /dashboard/organizations/:id
        var orgMatch = path.match(/^\/dashboard\/organizations\/([^/?#]+)/);
        if (orgMatch && orgMatch[1] && orgMatch[1] !== 'default') {
          var orgId = decodeOrgId(orgMatch[1]);
          l.replace(l.origin + basePath + '/dashboard/organizations?org=' + encodeURIComponent(orgId) + l.hash);
          return;
        }

        // 2. Match root short url /:id or /:base64 (e.g. /-P3-1sCrB3eAYQeLv_Dj or /LVAzLTFzQ3JCM2VBWVFlTHZfRGo)
        var rootMatch = path.match(/^\/([^/?#]+)/);
        if (rootMatch && rootMatch[1]) {
          var token = rootMatch[1];
          if (!reserved[token.toLowerCase()]) {
            var decoded = decodeOrgId(token);
            if (decoded.startsWith('-') || (decoded.length >= 8 && decoded !== token)) {
              l.replace(l.origin + basePath + '/dashboard/organizations?org=' + encodeURIComponent(decoded) + l.hash);
              return;
            }
          }
        }

        // Setup 404 links when DOM loads
        window.addEventListener('DOMContentLoaded', function() {
          var dashLink = document.getElementById('dash-link');
          var orgsLink = document.getElementById('orgs-link');
          var backBtn = document.getElementById('back-btn');

          if (dashLink) dashLink.href = basePath + '/dashboard';
          if (orgsLink) orgsLink.href = basePath + '/dashboard/organizations';

          if (backBtn) {
            backBtn.addEventListener('click', function(e) {
              e.preventDefault();
              if (window.history.length > 1) {
                window.history.back();
              } else {
                window.location.href = basePath + '/dashboard';
              }
            });
          }
        });
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <div class="badge">404</div>
      <h1>পৃষ্ঠাটি পাওয়া যায়নি</h1>
      <p>
        The page you are looking for does not exist or has been moved.<br />
        আপনি যে পেজটি খুঁজছেন তা পাওয়া যায়নি।
      </p>

      <div class="actions">
        <button id="back-btn" class="btn btn-secondary" type="button">
          ← পেছনে যান (Back)
        </button>
        <a id="dash-link" href="/bji-dawati-brothers/dashboard" class="btn btn-primary">
          ড্যাশবোর্ড (Dashboard)
        </a>
      </div>

      <div class="footer-links">
        <a id="orgs-link" href="/bji-dawati-brothers/dashboard/organizations">
          সংগঠন তালিকা দেখুন (Organizations)
        </a>
      </div>
    </div>
  </body>
</html>
