<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BJI Dawati Brothers</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // When GH Pages serves this 404.html for an unknown path, we:
      // 1. Store the full URL in sessionStorage
      // 2. Redirect to the base URL so the React app boots
      // The app's layout.tsx then reads sessionStorage and restores the route.
      var segmentsToKeep = 1; // number of path segments in basePath (/bji-dawati-brothers)
      var l = window.location;
      var origin = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
      var basePath = l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/');
      var redirectPath = l.pathname.slice(basePath.length) + l.search + l.hash;

      sessionStorage.setItem('spa_redirect', redirectPath || '/');
      l.replace(origin + basePath + '/?p=1');
    </script>
  </head>
  <body></body>
</html>
